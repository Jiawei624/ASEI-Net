base: method.yaml
data:
  datasets:
  - PUMP
model:
  d_model: 64
  layers: 2
  dropout: 0.2
  marginal_prototypes: 128
  joint_prototypes: 256
memory:
  pool_size: 8192
  rare_fraction: 0.25
stage1:
  epochs: 24
  batch_size: 128
  lr: 0.0002
  weight_decay: 0.001
  patience: 4
  stride: 1
  max_train_points: 0
  max_validation_points: 4096
  lr_patience: 2
  lr_factor: 0.5
  min_lr: 2.0e-05
teacher:
  epochs: 28
  patience: 5
  lr: 0.0003
  train_sequences: 512
  lr_patience: 3
  lr_factor: 0.5
  min_lr: 2.0e-05
stage2:
  epochs: 20
  patience: 5
  batch_pairs: 32
  lr: 5.0e-05
  train_pairs: 3072
  validation_pairs: 768
  lambda_pair: 0.15
  selection_normal_points: 32768
  selection_fpr_limit: 0.03
  selection_coverage_weight: 0.15
  lambda_tail: 0.2
  hard_negative_fraction: 0.5
  weight_decay: 0.0003
  lr_patience: 2
  lr_factor: 0.5
  min_lr: 1.0e-05
  evidence_hidden: 64
  readout_hidden: 32
  onset_fraction: 0.35
runtime:
  feature_batch_size: 256
  log_file: pump.log
