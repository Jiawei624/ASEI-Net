# Shared architecture and procedure for all four full-method experiments.
# Dataset files override model capacity and training hyperparameters only.
data:
  root: dataset
  manifest: null
  archive: TAB_dataset.zip
  multivariate_only: true
  use_prepared_manifest: true
  train_fraction: 0.6
  selection_fraction: 0.5
  default_channel_type: auto
  channel_types: null
model:
  window: 128
  heads: 4
memory:
  reference_peer_mode: all
  reference_neighbors: 4
  prototype_chunk: 32
  reference_block_length: 16
teacher:
  optimizer_update: task_batch
  batch_sequences: 16
  sequence_length: 256
  block_length: 128
  weight_decay: 1.0e-05
stage2:
  method: asei_net
  optimizer_update: task_batch
  variant: full
  block_length: 256
  families: [level, variance, temporal, relation]
  relation_generator: residual_var
  relation_l1: 0.001
  fixed_retention: 0.9
  eta: 0.2
  rho: 0.95
  reference_trim: 0.1
  reference_prior: 0.25
  reference_features: true
  evidence_horizons: [4, 16]
  task_strengths: [0.5, 1.0]
  evidence_transform: signed_log1p
  channel_embedding_dim: 8
  lambda_state: 0.1
  lambda_tail: 0.1
  lambda_pair: 0.1
  lambda_channel: 0.1
  local_scaling: true
  local_scale_prior: 64.0
  local_scale_clip: 10.0
  local_scale_min: 0.5
  local_scale_max: 3.0
  pair_margin: 0.5
  tail_fraction: 0.01
  tail_margin: 0.5
  selection_metric: normal_constrained
  selection_reference_fraction: 0.5
  selection_fpr_tolerance: 0.005
  discrete_max_values: 16
  donor_candidates: 16
  boundary_blend: 4
  reference_guard_multiplier: 3.0
calibration:
  method: parallel_normal
  ranking: continuous_tail
  weights: [0.05, 0.95]
  alpha: 0.01
  alphas: [0.0005, 0.001, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.3]
evaluation:
  skip_vus: false
  recovery_confirmation: 8
  regression_metrics: []
  supplementary_label_metrics: []
  latency_points: 0
runtime:
  cuda_device_order: PCI_BUS_ID
  cuda_visible_devices: '0'
  device: auto
  threads: 4
  interop_threads: 1
  cpu_cores: 8
  cpu_max_percent: 80
  output: outputs
  keep_intermediates: false
  run_subdir: runs
  timestamp_utc_offset_hours: 8
  log_dir: logs
  log_interval_seconds: 0
  seeds: [41, 42, 43, 44, 45]
  task_cache_memory_mb: 256
  detector_execution: block
  preparation_batch_pairs: 16
  preparation_workers: 4
  async_task_writes: true
  metric_workers: 4
  normal_selection_cache_mb: 512
  prefetch_batches: 2
  batch_working_memory_mb: 2048
  save_predictions: true
reports:
  inventory: data_inventory.csv
  eligible_manifest: eligible_manifest.csv
  summary: summary
  environment: environment.json
  predictions: predictions
